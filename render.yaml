services:
  - type: web
    name: kshitij-coder-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app backend.app db upgrade && flask --app backend.app seed-courses && flask --app backend.app create-admin && gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker --workers 1 --bind 0.0.0.0:$PORT backend.app:app
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_SAMESITE
        value: Lax
      - key: UPI_GATEWAY_ENVIRONMENT
        value: sandbox
