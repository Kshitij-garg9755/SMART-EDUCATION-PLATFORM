services:
  - type: web
    name: kshitij-coder-api
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app backend.app db upgrade && gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker --workers 1 --bind 0.0.0.0:$PORT backend.app:app
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kshitij-coder-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_SAMESITE
        value: Lax
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: UPI_GATEWAY_ENVIRONMENT
        value: sandbox

databases:
  - name: kshitij-coder-db
    plan: basic-256mb
    databaseName: kshitij_coder
    user: kshitij_coder
