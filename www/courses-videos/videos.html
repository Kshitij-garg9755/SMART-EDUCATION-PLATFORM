<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Course Player | Kshitij Coder</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <style>
        :root { color-scheme: light; }
        body { min-height: 100vh; background: #f3f6fb; color: #17243b; }
        .player-header { background: #fff; box-shadow: 0 3px 18px #12213b12; }
        .player-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; }
        .player-panel, .lesson-panel { background: #fff; border-radius: 16px; box-shadow: 0 10px 32px #12213b10; }
        .player-panel { padding: clamp(16px, 3vw, 28px); }
        .lesson-panel { padding: 20px; align-self: start; }
        .video-frame { width: 100%; aspect-ratio: 16 / 9; background: #101827; border-radius: 12px; }
        .video-frame video { width: 100%; height: 100%; border-radius: inherit; }
        .lesson-list { display: grid; gap: 8px; max-height: 65vh; overflow-y: auto; }
        .lesson-button { width: 100%; padding: 12px; border: 1px solid #e6ebf2; border-radius: 10px; background: #fff; color: inherit; text-align: left; }
        .lesson-button:hover, .lesson-button.active { border-color: #fb873f; background: #fff8f2; }
        .lesson-button.done::after { content: "Completed"; float: right; color: #198754; font-size: .75rem; }
        .lesson-button:disabled { color: #68758a; cursor: not-allowed; }
        .notes-box { min-height: 130px; }
        @media (max-width: 800px) { .player-layout { grid-template-columns: 1fr; } .lesson-list { max-height: none; } }
    </style>
</head>
<body>
    <header class="player-header py-3">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
            <a class="fw-bold fs-4 text-decoration-none text-dark" href="/">Kshitij <span class="text-primary">Coder</span></a>
            <a class="btn btn-outline-primary" href="/courses.html">Browse courses</a>
        </div>
    </header>

    <main class="container py-4 py-lg-5">
        <div class="mb-4">
            <p class="text-uppercase small fw-semibold text-primary mb-2">Your learning space</p>
            <h1 id="course-title" class="h2 mb-2">Loading course…</h1>
            <p id="course-description" class="text-muted mb-0"></p>
        </div>
        <div id="player-error" class="alert alert-danger d-none" role="alert"></div>
        <div id="course-access" class="alert alert-info d-none" role="status"></div>

        <div class="player-layout">
            <section class="player-panel">
                <h2 id="lesson-title" class="h4 mb-3">Select a lesson</h2>
                <div class="video-frame position-relative">
                    <video id="course-video" controls playsinline preload="metadata"></video>
                    <div id="video-message" class="position-absolute top-50 start-50 translate-middle text-center text-white px-3">
                        Choose a lesson to begin.
                    </div>
                </div>
                <p id="lesson-status" class="small text-muted mt-3 mb-2" role="status" aria-live="polite"></p>
                <section class="mt-4">
                    <h2 class="h5">My lesson notes</h2>
                    <textarea id="lesson-notes" class="form-control notes-box" placeholder="Write private notes for this lesson…"></textarea>
                    <div class="d-flex flex-wrap gap-2 mt-2">
                        <button id="save-notes" class="btn btn-primary" type="button">Save notes</button>
                        <button id="export-notes" class="btn btn-outline-secondary" type="button">Export notes</button>
                    </div>
                </section>
            </section>

            <aside class="lesson-panel">
                <h2 class="h5 mb-3">Course lessons</h2>
                <p id="lesson-count" class="small text-muted"></p>
                <div id="lesson-list" class="lesson-list" aria-live="polite"></div>
            </aside>
        </div>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/course-player.js"></script>
    <script src="/js/chat-widget.js"></script>
</body>
</html>
